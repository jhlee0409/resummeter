<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resummeter - Measure your code, Perfect your resume.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet" type="text/css" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', '"Helvetica Neue"', '"Segoe UI"', '"Apple SD Gothic Neo"', '"Noto Sans KR"', '"Malgun Gothic"', '"Apple Color Emoji"', '"Segoe UI Emoji"', '"Segoe UI Symbol"', 'sans-serif'],
              mono: ['"JetBrains Mono"', '"SF Mono"', 'Menlo', 'Monaco', '"Courier New"', 'monospace'],
            },
            colors: {
              brand: {
                50: '#eef4ff',
                100: '#d9e6ff',
                200: '#bcd3ff',
                300: '#8eb8ff',
                400: '#5990ff',
                500: '#3366ff',
                600: '#1b44f5',
                700: '#1433e1',
                800: '#172bb6',
                900: '#192a8f',
                950: '#141b57',
              },
              surface: {
                0: '#ffffff',
                50: '#fafbfc',
                100: '#f4f5f7',
                200: '#e8eaed',
                300: '#d1d5db',
              },
              dark: {
                950: '#09090b',
                900: '#0f0f14',
                850: '#141419',
                800: '#1a1a23',
                700: '#27273a',
                600: '#3f3f5c',
              }
            },
            keyframes: {
              'fade-in-up': {
                '0%': { opacity: '0', transform: 'translateY(16px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'fade-in': {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              'scale-in': {
                '0%': { opacity: '0', transform: 'scale(0.96)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              'shimmer': {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              'pulse-ring': {
                '0%': { transform: 'scale(0.85)', opacity: '0.8' },
                '100%': { transform: 'scale(2)', opacity: '0' },
              },
              'float': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-6px)' },
              },
              'spin-slow': {
                '0%': { transform: 'rotate(0deg)' },
                '100%': { transform: 'rotate(360deg)' },
              },
              'gradient-shift': {
                '0%, 100%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
              },
              'morph': {
                '0%, 100%': { borderRadius: '60% 40% 30% 70% / 60% 30% 70% 40%' },
                '50%': { borderRadius: '30% 60% 70% 40% / 50% 60% 30% 60%' },
              },
              'aurora-1': {
                '0%, 100%': { transform: 'translate(0, 0) scale(1)', opacity: '0.3' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)', opacity: '0.4' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)', opacity: '0.25' },
              },
              'aurora-2': {
                '0%, 100%': { transform: 'translate(0, 0) scale(1)', opacity: '0.25' },
                '33%': { transform: 'translate(-40px, 30px) scale(1.15)', opacity: '0.35' },
                '66%': { transform: 'translate(25px, -40px) scale(0.85)', opacity: '0.2' },
              },
              'aurora-3': {
                '0%, 100%': { transform: 'translate(0, 0) scale(1.05)', opacity: '0.2' },
                '33%': { transform: 'translate(50px, 20px) scale(0.9)', opacity: '0.3' },
                '66%': { transform: 'translate(-30px, -30px) scale(1.1)', opacity: '0.15' },
              },
              'glow-pulse': {
                '0%, 100%': { opacity: '0.4', transform: 'scale(1)' },
                '50%': { opacity: '0.7', transform: 'scale(1.05)' },
              },
              'border-glow': {
                '0%, 100%': { borderColor: 'rgba(51,102,255,0.15)' },
                '50%': { borderColor: 'rgba(51,102,255,0.3)' },
              },
              'shimmer-bar': {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(100%)' },
              },
            },
            animation: {
              'fade-in-up': 'fade-in-up 0.5s ease-out both',
              'fade-in': 'fade-in 0.4s ease-out both',
              'scale-in': 'scale-in 0.35s ease-out both',
              'shimmer': 'shimmer 2s infinite linear',
              'pulse-ring': 'pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite',
              'float': 'float 3s ease-in-out infinite',
              'spin-slow': 'spin-slow 8s linear infinite',
              'gradient-shift': 'gradient-shift 6s ease infinite',
              'morph': 'morph 8s ease-in-out infinite',
              'aurora-1': 'aurora-1 15s ease-in-out infinite',
              'aurora-2': 'aurora-2 18s ease-in-out infinite',
              'aurora-3': 'aurora-3 21s ease-in-out infinite',
              'glow-pulse': 'glow-pulse 3s ease-in-out infinite',
              'border-glow': 'border-glow 3s ease-in-out infinite',
              'shimmer-bar': 'shimmer-bar 2s ease-in-out infinite',
            },
            backgroundSize: {
              '300%': '300%',
            },
          }
        }
      }
    </script>
    <style>
      body {
        font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
      }

      /* Scrollbar */
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #3f3f5c; border-radius: 20px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #525280; }

      /* Glassmorphism */
      .glass {
        backdrop-filter: blur(20px) saturate(150%);
        -webkit-backdrop-filter: blur(20px) saturate(150%);
      }

      /* Focus ring */
      .focus-ring:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(51, 102, 255, 0.2);
      }

      /* Drag active */
      .drag-active {
        border-color: #3366ff !important;
        background-color: rgba(51,102,255,0.08) !important;
      }

      /* Noise texture overlay */
      .noise::before {
        content: '';
        position: absolute;
        inset: 0;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 0;
      }

      /* Gradient text */
      .text-gradient {
        background: linear-gradient(135deg, #3366ff 0%, #8b5cf6 50%, #3366ff 100%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* Subtle card hover lift */
      .card-hover {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .card-hover:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px -8px rgba(51,102,255,0.08);
      }

      /* Section number indicator */
      .section-num {
        font-variant-numeric: tabular-nums;
      }

      /* Markdown preview */
      .md-preview h1 { font-size: 1.5em; font-weight: 700; margin: 1em 0 0.5em; color: #f4f4f5; border-bottom: 1px solid #27273a; padding-bottom: 0.3em; }
      .md-preview h2 { font-size: 1.25em; font-weight: 700; margin: 1em 0 0.4em; color: #f4f4f5; }
      .md-preview h3 { font-size: 1.1em; font-weight: 600; margin: 0.8em 0 0.3em; color: #d4d4d8; }
      .md-preview p { margin: 0.5em 0; line-height: 1.7; }
      .md-preview ul, .md-preview ol { margin: 0.5em 0; padding-left: 1.5em; }
      .md-preview li { margin: 0.2em 0; line-height: 1.6; }
      .md-preview ul li { list-style-type: disc; }
      .md-preview ol li { list-style-type: decimal; }
      .md-preview strong { font-weight: 600; color: #fafafa; }
      .md-preview code { background: #1a1a23; padding: 0.15em 0.4em; border-radius: 4px; font-size: 0.9em; font-family: "JetBrains Mono", "SF Mono", monospace; color: #a5b4fc; }
      .md-preview pre { background: #141419; border: 1px solid #27273a; border-radius: 8px; padding: 0.8em 1em; overflow-x: auto; margin: 0.6em 0; }
      .md-preview pre code { background: none; padding: 0; }
      .md-preview blockquote { border-left: 3px solid #3366ff; padding-left: 1em; margin: 0.6em 0; color: #a1a1aa; }
      .md-preview a { color: #5990ff; text-decoration: underline; }
      .md-preview hr { border: none; border-top: 1px solid #27273a; margin: 1em 0; }
      .md-preview table { border-collapse: collapse; width: 100%; margin: 0.6em 0; }
      .md-preview th, .md-preview td { border: 1px solid #27273a; padding: 0.4em 0.8em; text-align: left; }
      .md-preview th { background: #141419; font-weight: 600; }

      /* Animated border gradient */
      .border-gradient {
        position: relative;
      }
      .border-gradient::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(135deg, #3366ff, #8b5cf6, #3366ff);
        background-size: 300% 300%;
        animation: gradient-shift 4s ease infinite;
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      .glass-card {
        background: rgba(255,255,255,0.03);
        backdrop-filter: blur(20px) saturate(150%);
        -webkit-backdrop-filter: blur(20px) saturate(150%);
        border: 1px solid rgba(255,255,255,0.06);
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
      }
      .glass-card:hover {
        border-color: rgba(255,255,255,0.12);
        box-shadow: 0 0 30px rgba(51,102,255,0.06);
      }

      .glow-border {
        box-shadow: 0 0 15px rgba(51,102,255,0.1), inset 0 0 15px rgba(51,102,255,0.03);
      }

      .aurora-bg {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "diff": "https://esm.sh/diff@5.2.0"
  }
}
</script>
</head>
  <body class="bg-dark-950 text-zinc-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
